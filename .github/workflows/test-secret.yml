name: Test GitHub Secret

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check if secret exists
        env:
          MY_VALUE: ${{ secrets.MY_TEST_SECRET }}
        run: |
          if [ -n "$MY_VALUE" ]; then
            echo "Secret is available!"
          else
            echo "Secret is missing!"
            exit 1
          fi
